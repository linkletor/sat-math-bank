<title>SAT Math Bank</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66;
  --line: #e4e3df; --accent: #1f5f4f; --accent-soft: #e8f1ee; --on-accent: #ffffff;
  --right: #1f7a4d; --wrong: #b23a30; --warn: #a8690f;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14150f; --panel: #1c1e17; --ink: #eceadf; --muted: #9a9a8e;
    --line: #2e3128; --accent: #7fd4ae; --accent-soft: #1f2d27; --on-accent: #10231b;
    --right: #6fce9c; --wrong: #ef8b80; --warn: #e0ae5c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #14150f; --panel: #1c1e17; --ink: #eceadf; --muted: #9a9a8e;
  --line: #2e3128; --accent: #7fd4ae; --accent-soft: #1f2d27; --on-accent: #10231b;
  --right: #6fce9c; --wrong: #ef8b80; --warn: #e0ae5c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
header {
  border-bottom: 1px solid var(--line); background: var(--panel);
  padding: 14px 20px; display: flex; align-items: center; gap: 14px;
  flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
}
header h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; font-weight: 650; }
.badge {
  font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
}
.spacer { flex: 1; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 22px 20px 64px; }
.layout { display: grid; grid-template-columns: 236px 1fr; gap: 22px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
aside { padding: 16px; position: sticky; top: calc(74px + env(safe-area-inset-top, 0px)); }
@media (max-width: 860px) { aside { position: static; } }
aside h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); margin: 0 0 8px; font-weight: 650;
}
aside section { margin-bottom: 18px; }
label.chk {
  display: flex; gap: 8px; align-items: baseline; padding: 3px 0;
  font-size: 13.5px; cursor: pointer; color: var(--ink);
}
label.chk input { accent-color: var(--accent); margin: 0; }
label.chk .n { margin-left: auto; color: var(--muted); font-size: 12px;
  font-variant-numeric: tabular-nums; }

button {
  font: inherit; cursor: pointer; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 9px 14px; transition: background .12s, border-color .12s;
}
button:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
button:disabled { opacity: .45; cursor: default; }
button.primary {
  background: var(--accent); border-color: var(--accent);
  color: var(--on-accent); font-weight: 600;
}
button.primary:hover:not(:disabled) { filter: brightness(1.07); }
button.full { width: 100%; }

.meta {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  font-size: 12px; color: var(--muted); margin-bottom: 14px;
}
.tag {
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  background: var(--bg);
}
.tag.hard { color: var(--wrong); border-color: color-mix(in srgb, var(--wrong) 35%, var(--line)); }
.tag.medium { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.tag.easy { color: var(--right); border-color: color-mix(in srgb, var(--right) 35%, var(--line)); }

.card { padding: 26px 28px; }
.stem { font-size: 17.5px; line-height: 1.6; margin: 0 0 20px; }
.stem sup { font-size: .72em; }
table.stim { border-collapse: collapse; margin: 16px 0; font-size: 14.5px; }
table.stim th, table.stim td {
  border: 1px solid var(--line); padding: 7px 13px; text-align: center;
}
table.stim th { background: var(--bg); font-weight: 600; }

.choices { display: flex; flex-direction: column; gap: 9px; }
.choice {
  display: flex; gap: 12px; align-items: center; text-align: left;
  padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); width: 100%; font-size: 15.5px;
}
.choice .lab {
  flex: none; width: 25px; height: 25px; border-radius: 50%;
  border: 1px solid var(--line); display: grid; place-items: center;
  font-size: 12.5px; font-weight: 650; color: var(--muted);
}
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-pressed="true"] .lab { border-color: var(--accent); color: var(--accent); }
.choice.right { border-color: var(--right); background: color-mix(in srgb, var(--right) 10%, transparent); }
.choice.right .lab { border-color: var(--right); color: var(--right); }
.choice.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 9%, transparent); }
.choice.wrong .lab { border-color: var(--wrong); color: var(--wrong); }

.spr { display: flex; gap: 10px; align-items: center; }
.spr input {
  font: inherit; padding: 11px 14px; border-radius: 9px; width: 190px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.spr input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 12.5px; color: var(--muted); }

.actions { display: flex; gap: 10px; align-items: center; margin-top: 22px; flex-wrap: wrap; }
.verdict { font-weight: 650; font-size: 14.5px; }
.verdict.right { color: var(--right); }
.verdict.wrong { color: var(--wrong); }

.rationale {
  margin-top: 20px; padding: 16px 18px; border-radius: 9px;
  background: var(--bg); border: 1px solid var(--line); font-size: 14.5px;
  line-height: 1.6;
}
.rationale h3 {
  margin: 0 0 7px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--muted); font-weight: 650;
}
.gates { margin-top: 12px; font-size: 11.5px; color: var(--muted); }
.gates code { font-size: 11px; }

.stats { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.empty { padding: 48px 28px; text-align: center; color: var(--muted); }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.srow { margin-bottom: 11px; font-size: 13px; }
.srow .top { display: flex; justify-content: space-between; gap: 10px; }
</style>

<script>
window.__BANK__ = JSON.parse(document.getElementById("bank").textContent);
/* SAT Math Bank - local practice demo. Vanilla JS, no dependencies. */

const S = {
  items: [], pool: [], queue: [], cur: null,
  picked: null, checked: false,
  seen: 0, right: 0, t0: Date.now(),
  byDomain: {},
  filters: { domain: new Set(), diff: new Set(), fmt: new Set() },
};

/* ---------- rendering helpers ---------- */

// Turn SymPy-ish source into something a student would recognise.
function pretty(raw) {
  if (raw == null) return '';
  let t = String(raw);
  t = t.replace(/\+\s*\(\s*-\s*([\d.]+)\s*\)/g, ' - $1');
  t = t.replace(/\+\s*\(\s*([\d.]+)\s*\)/g, ' + $1');
  t = t.replace(/\(\s*-\s*([\d.]+)\s*\)/g, '-$1');
  t = t.replace(/\*\*2/g, '<sup>2</sup>').replace(/\*\*3/g, '<sup>3</sup>');
  t = t.replace(/\*\*(\d+)/g, '<sup>$1</sup>');
  t = t.replace(/([\d.])\s*\*\s*([a-zA-Z])/g, '$1$2');
  t = t.replace(/\*/g, '·');
  t = t.replace(/(^|[\s(])-(?=[\d.])/g, '$1−');
  t = t.replace(/\s-\s/g, ' − ');
  return t.replace(/\s+/g, ' ').trim();
}

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const $ = (id) => document.getElementById(id);

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

/* ---------- filters ---------- */

function buildFilters() {
  const mk = (host, key, values) => {
    host.innerHTML = '';
    values.forEach(([val, n]) => {
      const id = `${key}-${val}`.replace(/\W/g, '');
      const lab = el('label', 'chk');
      lab.innerHTML =
        `<input type="checkbox" id="${id}" checked>` +
        `<span>${val === 'mcq' ? 'Multiple choice'
              : val === 'spr' ? 'Student-produced' : val}</span>` +
        `<span class="n">${n}</span>`;
      lab.querySelector('input').addEventListener('change', (e) => {
        e.target.checked ? S.filters[key].add(val) : S.filters[key].delete(val);
        refreshPool();
      });
      S.filters[key].add(val);
      host.appendChild(lab);
    });
  };
  const tally = (f) => {
    const m = new Map();
    S.items.forEach((i) => m.set(f(i), (m.get(f(i)) || 0) + 1));
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const diffOrder = { easy: 0, medium: 1, hard: 2 };
  mk($('fDomain'), 'domain', tally((i) => i.domain));
  mk($('fDiff'), 'diff', tally((i) => i.difficulty)
      .sort((a, b) => diffOrder[a[0]] - diffOrder[b[0]]));
  mk($('fFmt'), 'fmt', tally((i) => i.fmt));
}

function refreshPool() {
  const f = S.filters;
  S.pool = S.items.filter((i) =>
    f.domain.has(i.domain) && f.diff.has(i.difficulty) && f.fmt.has(i.fmt));
  $('poolInfo').textContent = `${S.pool.length} question${S.pool.length === 1 ? '' : 's'} match`;
  $('btnStart').disabled = S.pool.length === 0;
}

/* ---------- session ---------- */

function shuffle(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function start() {
  S.queue = shuffle(S.pool);
  // Drop focus from the Start button, otherwise Enter re-triggers it
  // instead of reaching the keyboard handler below.
  const b = $('btnStart');
  if (b) b.blur();
  next();
}

function next() {
  S.picked = null;
  S.checked = false;
  S.cur = S.queue.shift() || null;
  render();
}

function check() {
  if (S.checked || !S.cur) return;
  const it = S.cur;
  let given = S.picked;
  if (it.fmt === 'spr') {
    given = ($('sprInput').value || '').trim();
    if (!given) return;
  }
  const ok = it.fmt === 'mcq'
    ? given === it.answer_label
    : normalise(given) === normalise(it.answer_value);

  S.checked = true;
  S.seen++;
  if (ok) S.right++;
  const d = (S.byDomain[it.domain] ||= { n: 0, k: 0 });
  d.n++; if (ok) d.k++;
  S.lastOk = ok;
  render();
  updateStats();
}

// Accept 3/4, 0.75 and .75 as the same answer, the way the real grid does.
function normalise(v) {
  const s = String(v).trim();
  if (s.includes('/')) {
    const [a, b] = s.split('/').map(Number);
    if (b) return (a / b).toFixed(6);
  }
  const n = Number(s);
  return Number.isFinite(n) ? n.toFixed(6) : s;
}

function updateStats() {
  $('sSeen').textContent = S.seen;
  $('sRight').textContent = S.right;
  $('sAcc').textContent = S.seen ? Math.round((S.right / S.seen) * 100) + '%' : '—';

  const host = $('breakdown');
  const rows = Object.entries(S.byDomain);
  if (!rows.length) { host.textContent = 'No answers yet.'; return; }
  host.innerHTML = '';
  rows.sort((a, b) => b[1].n - a[1].n).forEach(([name, s]) => {
    const pct = Math.round((s.k / s.n) * 100);
    const row = el('div', 'srow');
    row.innerHTML =
      `<div class="top"><span>${name}</span><b>${pct}%</b></div>` +
      `<div class="bar"><i style="width:${pct}%"></i></div>` +
      `<div class="hint">${s.k} of ${s.n}</div>`;
    host.appendChild(row);
  });
}

/* ---------- view ---------- */

function render() {
  const host = $('main');
  host.innerHTML = '';

  if (!S.cur) {
    const done = S.seen > 0;
    host.appendChild(el('div', 'empty',
      done
        ? `<h2 style="margin:0 0 8px">Session complete</h2>
           <p>You answered <b>${S.right}</b> of <b>${S.seen}</b> correctly
           (${Math.round((S.right / S.seen) * 100)}%).</p>
           <button class="primary" onclick="location.reload()">Start again</button>`
        : `<p>Pick your filters, then press <b>Start practice</b>.</p>`));
    return;
  }

  const it = S.cur;
  const card = el('div', 'card');

  const meta = el('div', 'meta');
  meta.innerHTML =
    `<span class="tag">${it.domain}</span>` +
    `<span class="tag ${it.difficulty}">${it.difficulty}</span>` +
    `<span class="tag">${it.fmt === 'mcq' ? 'Multiple choice' : 'Student-produced response'}</span>` +
    `<span class="spacer"></span>` +
    `<span>${it.skill}</span>`;
  card.appendChild(meta);

  if (it.stimulus) card.appendChild(el('div', null, it.stimulus));
  card.appendChild(el('div', 'stem', pretty(it.stem)));

  if (it.fmt === 'mcq') {
    const box = el('div', 'choices');
    it.choices.forEach((txt, i) => {
      const label = 'ABCD'[i];
      const b = el('button', 'choice');
      b.setAttribute('aria-pressed', String(S.picked === label));
      b.innerHTML = `<span class="lab">${label}</span><span>${pretty(txt)}</span>`;
      if (S.checked) {
        if (label === it.answer_label) b.classList.add('right');
        else if (label === S.picked) b.classList.add('wrong');
        b.disabled = true;
      } else {
        b.addEventListener('click', () => { S.picked = label; render(); });
      }
      box.appendChild(b);
    });
    card.appendChild(box);
  } else {
    const box = el('div', 'spr');
    box.innerHTML =
      `<input id="sprInput" placeholder="Your answer" autocomplete="off"
              ${S.checked ? 'disabled' : ''} value="${S.lastEntry || ''}">` +
      `<span class="hint">Enter a number or fraction, e.g. 12 or 3/4</span>`;
    card.appendChild(box);
  }

  const actions = el('div', 'actions');
  if (!S.checked) {
    const b = el('button', 'primary', 'Check answer');
    b.addEventListener('click', () => {
      if (it.fmt === 'spr') S.lastEntry = ($('sprInput').value || '').trim();
      check();
    });
    if (it.fmt === 'mcq' && !S.picked) b.disabled = true;
    actions.appendChild(b);
  } else {
    actions.appendChild(el('span', `verdict ${S.lastOk ? 'right' : 'wrong'}`,
      S.lastOk ? 'Correct' : `Not quite — the answer is ${pretty(it.answer_value)}`));
    actions.appendChild(el('span', 'spacer'));
    const n = el('button', 'primary', S.queue.length ? 'Next question' : 'Finish');
    n.addEventListener('click', () => { S.lastEntry = ''; next(); });
    actions.appendChild(n);
  }
  card.appendChild(actions);

  if (S.checked) {
    const r = el('div', 'rationale');
    r.innerHTML = `<h3>Why</h3><div>${pretty(it.rationale)}</div>` +
      `<div class="gates">Verified by: ${Object.entries(it.gates)
        .filter(([, v]) => v).map(([k]) => `<code>${k}</code>`).join(' · ')}
        · item <code>${it.id}</code></div>`;
    card.appendChild(r);
  }

  host.appendChild(card);
  if (it.fmt === 'spr' && !S.checked) $('sprInput').focus();
}

/* keyboard: A-D to pick, Enter to check/advance */
document.addEventListener('keydown', (e) => {
  if (!S.cur) return;
  if (e.target.tagName === 'INPUT' && e.key !== 'Enter') return;
  const k = e.key.toUpperCase();
  if (!S.checked && S.cur.fmt === 'mcq' && 'ABCD'.includes(k)) {
    e.preventDefault();
    S.picked = k;
    render();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (S.checked) { S.lastEntry = ''; next(); } else { check(); }
  }
});

if ($('sTime')) {
  setInterval(() => { $('sTime').textContent = fmtTime(Date.now() - S.t0); }, 1000);
}

/* ---------- boot ---------- */

// The review tool also loads this file for pretty(); only boot the practice
// UI when the practice shell is actually on the page.
function boot(d) {
  S.items = d.items;
  $('countBadge').textContent = `${d.count} items`;
  buildFilters();
  refreshPool();
  render();
  $('btnStart').addEventListener('click', start);
}

// The bundled build inlines the bank; the local server serves it as a file.
if ($('countBadge')) {
  if (window.__BANK__) {
    boot(window.__BANK__);
  } else {
    fetch('/data/items.json')
      .then((r) => r.json())
      .then(boot)
      .catch((err) => {
        $('main').innerHTML =
          `<div class="empty">Could not load the bank.<br>
           Run <code>python -m pipeline.generate</code> first.<br><br>
           <span class="hint">${err}</span></div>`;
      });
  }
}
</script>
</body>
</html>
